services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SchoolManagementDb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./school-management-api
      dockerfile: Dockerfile
    ports:
      - "5067:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SchoolManagementDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./school-management-api/src/SchoolManagement/appsettings.Development.json:/app/appsettings.Development.json:ro

  ui:
    build:
      context: ./school-management-ui
      dockerfile: Dockerfile
    ports:
      - "4201:80"
    depends_on:
      - api

volumes:
  pgdata: