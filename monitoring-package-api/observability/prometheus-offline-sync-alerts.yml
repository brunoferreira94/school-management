groups:
  - name: offline_sync_alerts
    interval: 30s
    rules:
      # ─────────────────────────────────────────────────────────────
      # NOTA (nomes das séries): o pipeline OTLP (Meter "SchoolManagement"
      # → otel-collector → exporter prometheus :8889) exporta o ponto
      # como underscore, SEM sufixo "_total":
      #   Meter "revision.adherence"        → série "revision_adherence"
      #   Meter "idempotency_key.missing"   → série "idempotency_key_missing"
      #   Meter "offline_sync.total"        → série "offline_sync_total"
      # O sufixo "_total" só existe nas métricas do prometheus-net
      # (ex.: http_requests_total, expostas em /metrics da API).
      # Smoke test: observability/test-offline-sync-metrics.sh
      # ─────────────────────────────────────────────────────────────
      # NOTA (escopo): o gate do rollout é decidido POR AMBIENTE, então toda
      # expressão aqui é filtrada pelo label `environment` dos jobs de scrape
      #   production = job "school-management-prod"     (Render, branch main)
      #   staging     = job "school-management-staging" (Render, branch development)
      # Sem esse filtro dois erros acontecem: (1) o `absent()` é global e a
      # presença da série em um ambiente mascara a ausência no outro; (2) o
      # rate agregado mistura o tráfego do stack local (api:5000 / otel-collector)
      # com o de produção, diluindo o número real do gate.
      # ─────────────────────────────────────────────────────────────

      # A métrica de adesão sumiu DO AMBIENTE → a medição está quebrada ou o
      # ambiente ainda não registrou nenhuma mutação (nas duas situações o
      # gate não pode ser decidido — a descrição lista as causas).
      - alert: OfflineSyncRevisionMetricAbsent
        expr: absent(revision_adherence{environment="production"}) == 1
        for: 15m
        labels:
          severity: warning
          component: offline_sync
        annotations:
          summary: "revision_adherence ausente em produção (job school-management-prod)"
          description: "Sem revision_adherence em produção há 15min: build antigo sem a ponte Meter→Prometheus, scraping falhando, instância hibernando ou ainda nenhuma mutação registrada. Sem esta série o rollout do enforcement de revisão não pode ser decidido."

      # Idem no staging — é ali que a janela de observação de ≥7 dias é contada.
      # severity info de propósito: no início da janela (instância nova ou sem
      # mutações ainda) ela fica firing por dias, e não merece e-mail a cada 30min;
      # o webhook registra o estado para quem estiver acompanhando a janela.
      - alert: OfflineSyncRevisionMetricAbsentStaging
        expr: absent(revision_adherence{environment="staging"}) == 1
        for: 15m
        labels:
          severity: info
          component: offline_sync
        annotations:
          summary: "revision_adherence ausente no staging (job school-management-staging)"
          description: "Sem revision_adherence no staging há 15min (build antigo, scraping falhando, instância hibernando ou nenhuma mutação ainda). O staging é onde a janela de observação de ≥7 dias é medida; enquanto a série não aparece, os dias de janela não contam."

      # Adesão de If-Match baixa em uma rota — o enforcement NÃO deve ser
      # ampliado para essa rota. `wildcard` conta como não adesão (If-Match: *
      # não protege a atualização).
      # Escopo `route=~"PUT .*"`: por contrato (runbook §Passo 2) só o PUT de
      # recurso envia If-Match — POST (criação/upsert de collection) e DELETE
      # nunca enviam e ficariam estruturalmente em 0%, gerando falso positivo
      # em tráfego intenso de criação. Rotas candidatas a EnforcedPaths são PUT.
      - alert: OfflineSyncLowRevisionAdherence
        expr: |
          sum by (environment, route) (rate(revision_adherence{state="provided", environment=~"production|staging", route=~"PUT .*"}[1h]))
            / sum by (environment, route) (rate(revision_adherence{environment=~"production|staging", route=~"PUT .*"}[1h])) < 0.99
          and
          sum by (environment, route) (increase(revision_adherence{environment=~"production|staging", route=~"PUT .*"}[1h])) > 20
        for: 1h
        labels:
          severity: warning
          component: offline_sync
        annotations:
          summary: "Adesão de If-Match abaixo de 99% na rota {{ $labels.route }} ({{ $labels.environment }})"
          description: "[{{ $labels.environment }}] Rota {{ $labels.route }}: apenas {{ $value | humanizePercentage }} das mutações enviaram If-Match na última hora. Se esta rota estiver no OfflineSync:Revision:EnforcedPaths, o enforcement vai gerar 428 para clientes legados — amplie o EnforcedPaths só após a adesão normalizar."

      # Lotes do sync-batch sem Idempotency-Key acima de 1% — condição de
      # bloqueio do rollout (gate: missing_key < 1%).
      #
      # ESCOPO `source="batch"` (tag adicionada em 2026-11-19): o RequireKey só
      # enforça no sync-batch, então é essa superfície que o gate mede — mesma
      # lógica do revision_missing, que já é incrementado só pelo guard. As
      # mutações HTTP individuais são opt-in (a UI online não envia chave por
      # design) e somá-las aqui leriam ~100% missing eterno, tornando o alerta
      # ruído permanente na janela de observação; a adesão delas é consulta
      # informativa no runbook (offline-sync-rollout.md §Passo 4).
      # Sem tráfego de batch a razão é 0/0 = NaN → não dispara: sem série
      # source="batch" o gate é INDESCISÍVEL (não é falha) — o smoke test
      # (tasks 5.3) gera o tráfego que o torna decisível.
      - alert: OfflineSyncHighMissingIdempotencyKey
        expr: |
          sum by (environment) (rate(idempotency_key_missing{environment=~"production|staging", source="batch"}[10m]))
            / (sum by (environment) (rate(idempotency_key_missing{environment=~"production|staging", source="batch"}[10m])) + sum by (environment) (rate(idempotency_key_provided{environment=~"production|staging", source="batch"}[10m]))) > 0.01
        for: 30m
        labels:
          severity: warning
          component: offline_sync
        annotations:
          summary: "Mutações do sync-batch sem Idempotency-Key acima de 1% ({{ $labels.environment }})"
          description: "[{{ $labels.environment }}] {{ $value | humanizePercentage }} dos lotes do sync-batch sem Idempotency-Key na última meia hora. O gate do rollout (tasks 5.1/5.4) exige missing_key < 1% justamente na superfície em que o RequireKey enforça (source=batch)."

      # Taxa de conflito de revisão (412) alta — sinal de ETag stale demais
      # na UI (baseVersion desatualizado) ou de concorrência real.
      # Denominador só em PUT: o 412 só existe onde If-Match é enviado; somar
      # POST/DELETE (estruturalmente sem If-Match) diluiria a taxa e esconderia
      # um conflito real abaixo do limiar de 5%.
      - alert: OfflineSyncHighRevisionConflictRate
        expr: |
          sum by (environment) (rate(revision_conflict{environment=~"production|staging"}[15m]))
            / sum by (environment) (rate(revision_adherence{environment=~"production|staging", route=~"PUT .*"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: offline_sync
        annotations:
          summary: "Taxa de conflito de revisão (412) acima de 5% ({{ $labels.environment }})"
          description: "[{{ $labels.environment }}] {{ $value | humanizePercentage }} das mutações resultaram em 412 (If-Match stale) nos últimos 15min. Verifique se a UI está reaplicando o ETag capturado no GET por recurso."

      # Conflitos no sync-batch acima de 1% das operações.
      - alert: OfflineSyncBatchConflictRateHigh
        expr: |
          sum by (environment) (rate(offline_sync_conflicts{environment=~"production|staging"}[15m]))
            / sum by (environment) (rate(offline_sync_total{environment=~"production|staging"}[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
          component: offline_sync
        annotations:
          summary: "Conflitos do sync-batch acima de 1% ({{ $labels.environment }})"
          description: "[{{ $labels.environment }}] {{ $value | humanizePercentage }} das operações do sync-batch foram marcadas como conflict nos últimos 15min."
