version: '3.8'

services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.83.0
    command: ["--config=/conf/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/conf/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP (also receives alerts)
      - "8889:8889"    # Prometheus exporter (collector)
    networks:
      - observability-net

  # Prometheus - metrics storage & scraping
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-health-alerts.yml:/etc/prometheus/prometheus-health-alerts.yml:ro
      - ./prometheus-academic-year-alerts.yml:/etc/prometheus/prometheus-academic-year-alerts.yml:ro
      - ./prometheus-support-health-alerts.yml:/etc/prometheus/prometheus-support-health-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability-net
    restart: unless-stopped

  # Alertmanager - alert routing & notification
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - observability-net
    restart: unless-stopped

  # Grafana - visualization & dashboards
  grafana:
    image: grafana/grafana:9.5.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-tempo-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - observability-net
    restart: unless-stopped

  # Tempo - distributed tracing
  tempo:
    image: grafana/tempo:1.6.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability-net
    restart: unless-stopped

  # Blackbox Exporter - HTTP health probing
  # Necessário para a regra de falhas consecutivas (3 em 5 min)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    command:
      - '--config.file=/etc/blackbox-exporter/config.yml'
    volumes:
      - ./blackbox-exporter-config.yml:/etc/blackbox-exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - observability-net
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  tempo-data:

networks:
  observability-net:
    driver: bridge
