<div class="assets-list">
  <h2>Assets</h2>
  <table>
    <thead>
      <tr>
        <th>Tag</th>
        <th>Name</th>
        <th>Category</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let asset of assets">
        <td>{{ asset.tag }}</td>
        <td>{{ asset.name }}</td>
        <td>{{ asset.category }}</td>
        <td>{{ asset.location }}</td>
      </tr>
    </tbody>
  </table>
</div>
